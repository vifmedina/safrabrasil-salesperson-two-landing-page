<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carlos Safra Brasil</title>
    <meta
      name="description"
      content="Carlos Safra Brasil — identidade digital oficial. Razão social e CNPJ."
    />
    <meta name="theme-color" content="#1c130d" />

    <!-- Dados estruturados para leitura automatizada (API / scrapers) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Carlos Safra Brasil",
        "legalName": "67.849.698 CARLOS RODOLFO BARBOSA PRADO",
        "taxID": "67.849.698/0001-95",
        "identifier": {
          "@type": "PropertyValue",
          "propertyID": "CNPJ",
          "value": "67.849.698/0001-95"
        },
        "addressCountry": "BR"
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Work+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  </head>
  <body>
    <main class="stage">
      <div class="grain"></div>
      <div class="glow" aria-hidden="true"></div>

      <div class="content">
        <header class="hero">
          <p class="eyebrow">Identidade digital oficial</p>
          <h1 class="brand" data-field="nome-fantasia" itemprop="name">
            Carlos<br />Safra<span>&nbsp;Brasil</span>
          </h1>
        </header>

        <section class="card" aria-label="Dados cadastrais">
          <div class="seal" aria-hidden="true">
            <svg viewBox="0 0 120 120" class="seal-svg">
              <circle cx="60" cy="60" r="56" class="seal-ring" />
              <circle cx="60" cy="60" r="47" class="seal-ring-inner" />
              <path
                d="M60 30 L60 78 M60 30 C50 40 46 50 46 60 C46 70 52 76 60 78 M60 30 C70 40 74 50 74 60 C74 70 68 76 60 78"
                class="seal-mark"
                fill="none"
                stroke-width="3"
                stroke-linecap="round"
              />
            </svg>
          </div>

          <dl class="details">
            <div class="row">
              <dt>Razão social</dt>
              <dd data-field="razao-social" itemprop="legalName">
                67.849.698 CARLOS RODOLFO BARBOSA PRADO
              </dd>
            </div>

            <div class="divider" aria-hidden="true"></div>

            <div class="row">
              <dt>CNPJ</dt>
              <dd class="cnpj-row">
                <span data-field="cnpj" itemprop="taxID" id="cnpj-value"
                  >67.849.698/0001-95</span
                >
                <button
                  type="button"
                  class="copy-btn"
                  id="copy-btn"
                  aria-label="Copiar CNPJ"
                >
                  <svg
                    viewBox="0 0 20 20"
                    width="16"
                    height="16"
                    aria-hidden="true"
                  >
                    <rect
                      x="6"
                      y="6"
                      width="11"
                      height="11"
                      rx="1.5"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.4"
                    />
                    <path
                      d="M4 13.5V4.5C4 3.67 4.67 3 5.5 3H13"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.4"
                    />
                  </svg>
                </button>
              </dd>
            </div>
          </dl>

          <span class="toast" id="toast" role="status" aria-live="polite"
            >CNPJ copiado</span
          >
        </section>
      </div>

      <div class="field" aria-hidden="true">
        <svg class="field-svg" viewBox="0 0 800 140" preserveAspectRatio="none">
          <!-- linha do horizonte -->
          <line x1="0" y1="130" x2="800" y2="130" class="horizon" />
        </svg>
        <div class="stalks" id="stalks"></div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
